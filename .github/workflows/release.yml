name: Build multi-platform

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
          - platform: ubuntu-22.04
            label: linux
          - platform: macos-latest
            label: macos

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Generate macOS icon.icns
        if: matrix.platform == 'macos-latest'
        run: |
          set -e
          SRC="src-tauri/icons/128x128@2x.png"
          OUT="src-tauri/icons/icon.icns"
          SET="src-tauri/icons/icon.iconset"
          rm -rf "$SET"
          mkdir -p "$SET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "$SET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double "$SRC" --out "$SET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$SET" --out "$OUT"
          rm -rf "$SET"
          test -f "$OUT"

      - name: Install frontend deps
        run: npm ci

      - name: Build (Windows / Linux / macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MimoDesk ${{ github.ref_name }}
          releaseBody: |
            Multi-platform build.

            | Platform | Artifact |
            |----------|----------|
            | Windows | `.exe` / `-setup.exe` / `.msi` |
            | Linux | `.AppImage` / `.deb` |
            | macOS | `.dmg` / `.app.tar.gz` |

            Host and client should use the same version.
          releaseDraft: true
          prerelease: false
          args: ""

  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Note
        run: |
          echo "Build finished. Check the draft release assets on the repo Releases page."
