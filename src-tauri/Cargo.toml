[package]
name = "mimodesk"
version = "0.2.0"
description = "Serverless P2P remote desktop — written with MiMo-X-Pro-Preview"
authors = ["MimoDesk"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mimodesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production builds must enable this so the UI is embedded instead of
# loading devUrl (localhost:1420). `tauri build` passes it automatically.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
iroh = "1.0"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
rand = "0.8"
xcap = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
enigo = "0.2"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
